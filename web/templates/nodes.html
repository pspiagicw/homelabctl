{{define "panel"}}
<section class="sentinel {{if eq .Sentinel.State "Normal"}}sentinel-ok{{else}}sentinel-warn{{end}}">
	<span class="sentinel-label">Sentinel</span>
	<strong>{{.Sentinel.State}}</strong>
	<span class="sentinel-seen">last seen {{seen .Sentinel.LastSeen}}</span>
</section>

{{with .Message}}
<div class="snack{{if $.Failed}} snack-error{{end}}" role="status">{{.}}</div>
{{end}}

<section class="nodes">
	{{range .Nodes}}
	<article class="card">
		<header class="card-head">
			<h2>{{.Name}}</h2>
			<span class="chip chip-{{.PowerState}}">{{.PowerState}}</span>
		</header>
		<dl class="card-meta">
			<dt>Address</dt><dd>{{.Address}}</dd>
			<dt>Last seen</dt><dd>{{seen .LastSeen}}</dd>
		</dl>
		<div class="card-actions">
			<button class="btn btn-boot"
				hx-post="/ui/nodes/{{.Name}}/boot" hx-target="#panel" hx-disabled-elt="this"
				{{if busy .PowerState}}disabled{{end}}>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
				Boot
			</button>
			<button class="btn btn-shutdown"
				hx-post="/ui/nodes/{{.Name}}/shutdown" hx-target="#panel" hx-disabled-elt="this"
				hx-confirm="Shut down {{.Name}}?"
				{{if busy .PowerState}}disabled{{end}}>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3h-2v10h2V3zm4.83 2.17-1.42 1.42A6.98 6.98 0 0 1 19 12a7 7 0 0 1-14 0c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17A8.96 8.96 0 0 0 3 12a9 9 0 0 0 18 0c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
				Shut down
			</button>
		</div>
	</article>
	{{else}}
	<p class="empty">No nodes configured.</p>
	{{end}}
</section>
{{end}}
