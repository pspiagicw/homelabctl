# /etc/homelabctl/config.yaml
# homelabctl example configuration — copy this, then replace every value
# with your own hosts, addresses and services. All durations are in seconds.

# ─────────────────────────────────────────────
# Global SSH defaults, used to shut nodes down
# ─────────────────────────────────────────────
ssh:
  user: homelabctl
  identity_file: /etc/homelabctl/keys/id_ed25519
  port: 22
  connection_timeout: 10
  strict_host_key_checking: true
  known_hosts_file: /etc/homelabctl/keys/known_hosts

# ─────────────────────────────────────────────
# Sentinel: a host on mains power (NOT battery backed) used as a power
# probe. It is never managed and must not appear under nodes:.
# ─────────────────────────────────────────────
sentinel:
  host: router
  address: 192.168.10.1
  check_interval: 30          # how often the sentinel is pinged
  outage_grace_period: 600    # unreachable this long -> outage confirmed, nodes shut down
  restore_grace_period: 600   # reachable this long again -> outage over, boots allowed

# ─────────────────────────────────────────────
# Managed nodes (on battery/inverter backup)
# ─────────────────────────────────────────────
nodes:
  nas:
    address: 192.168.10.20
    mac: "aa:bb:cc:00:00:20"
    wait_after_boot: 120        # wait after Wake-on-LAN before pinging to confirm "on"
    wait_after_shutdown: 60     # wait after shutdown before pinging to confirm "off"

  hypervisor:
    address: 192.168.10.21
    mac: "aa:bb:cc:00:00:21"
    wait_after_boot: 90
    wait_after_shutdown: 60

  media:
    address: 192.168.10.22
    mac: "aa:bb:cc:00:00:22"
    wait_after_boot: 60
    wait_after_shutdown: 60

  # unmanaged: true = manual Boot / Shut down only (UI, API, CLI).
  # The sentinel never shuts it down and doesn't block its boot during an
  # outage, and the schedule never touches it. Keep it out of profiles.
  desktop:
    address: 192.168.10.40
    mac: "aa:bb:cc:00:00:40"
    wait_after_boot: 60
    wait_after_shutdown: 60
    unmanaged: true

# ─────────────────────────────────────────────
# Services: links shown on the dashboard (and, later, uptime-checked).
# List order = dashboard order. Groups appear in first-seen order.
#   name         required, unique display name
#   description  short line shown under the name
#   url          where the tile links to
#   icon         image URL (https://github.com/homarr-labs/dashboard-icons)
#   group        optional dashboard section
#   node         optional host node, must be a key in nodes:
# ─────────────────────────────────────────────
services:
  - name: Hypervisor
    description: Virtual machines and containers
    url: https://192.168.10.21:8006
    icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/proxmox.svg
    group: Infrastructure
    node: hypervisor

  - name: File shares
    description: Network storage
    url: http://192.168.10.20
    icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/truenas.svg
    group: Infrastructure
    node: nas

  - name: DNS
    description: Network-wide ad blocking
    url: http://192.168.10.30/admin
    icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/pi-hole.svg
    group: Infrastructure

  - name: Media server
    description: Movies and TV
    url: http://192.168.10.22:8096
    icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jellyfin.svg
    group: Media
    node: media

  - name: Photos
    description: Photo and video backup
    url: http://192.168.10.23:2283
    icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/immich.svg
    group: Media

# ─────────────────────────────────────────────
# Profiles: named sets of active nodes.
# List order = boot order. Shutdown = reverse order.
# ─────────────────────────────────────────────
profiles:
  daytime:
    nodes:
      - nas
      - hypervisor

  evening:
    nodes:
      - nas
      - media

  off:
    nodes: []                   # shuts down all managed nodes

  all:
    nodes:
      - nas
      - hypervisor
      - media

# ─────────────────────────────────────────────
# Default daily schedule (24h local time)
# ─────────────────────────────────────────────
schedule:
  entries:
    - time: "08:00"
      profile: daytime
    - time: "18:00"
      profile: evening
    - time: "00:30"
      profile: off

# ─────────────────────────────────────────────
# Manual override behavior
# ─────────────────────────────────────────────
# overrides:
#   default_duration: 1h          # used when --for / --indefinite not specified
  # --for <duration> and --indefinite are CLI flags, not config values,
  # but the default above governs unflagged `homelabctl override <profile>` calls
