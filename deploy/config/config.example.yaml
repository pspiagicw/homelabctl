# /etc/homelabctl/config.yaml
# homelabctl configuration — daemon runs on falcon-control

# ─────────────────────────────────────────────
# Global SSH defaults (per-node overrides below)
# ─────────────────────────────────────────────
ssh:
  user: root
  identity_file: /home/pspiagicw/.development/.ssh/falcon
  port: 22
  connection_timeout: 10
  strict_host_key_checking: true
  known_hosts_file: /etc/homelabctl/keys/known_hosts

# ─────────────────────────────────────────────
# Sentinel: mains-power proxy, NOT a managed node
# ─────────────────────────────────────────────
sentinel:
  host: falcon-lite
  address: 172.20.1.46
  check_interval: 5          # how often we ping falcon-lite
  outage_grace_period: 10    # 15 min of no response before declaring outage
  restore_grace_period: 10   # 15 min of falcon-lite being back before WoL'ing nodes

# ─────────────────────────────────────────────
# Managed nodes (all on inverter/battery backup)
# ─────────────────────────────────────────────
nodes:
  falcon-heavy:
    address: 172.20.1.45
    mac: "b8:27:eb:00:00:02"
    wait_after_boot: 180        # static delay before considered "ready"
    services:
      - jellyfin
      - immich
      - truenas

  falcon1:
    address: 172.20.1.44
    mac: "b8:27:eb:00:00:03"
    wait_after_boot: 60
    services:
      - proxmox-backup-server
      - borg-target

  falcon2:
    address: 172.20.1.43
    mac: "b8:27:eb:00:00:04"
    wait_after_boot: 45
    services:
      - transmission
      - navidrome
      - slskd

# ─────────────────────────────────────────────
# Profiles: named sets of active nodes.
# List order = boot order. Shutdown = reverse order.
# ─────────────────────────────────────────────
profiles:
  backup:
    nodes:
      - falcon1
      - falcon-heavy

  movie:
    nodes:
      - falcon-heavy
      - falcon2

  off:
    nodes: []                   # shuts down all managed nodes (falcon-control excluded, always_on)

  all:
    nodes:
      - falcon1
      - falcon-heavy
      - falcon2

# ─────────────────────────────────────────────
# Default daily schedule (24h local time)
# ─────────────────────────────────────────────
schedule:
  entries:
    - time: "09:00"
      profile: backup
    - time: "12:30"
      profile: movie
    - time: "23:00"
      profile: off

# ─────────────────────────────────────────────
# Manual override behavior
# ─────────────────────────────────────────────
# overrides:
#   default_duration: 1h          # used when --for / --indefinite not specified
  # --for <duration> and --indefinite are CLI flags, not config values,
  # but the default above governs unflagged `homelabctl override <profile>` calls
