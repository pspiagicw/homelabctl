# /etc/homelabctl/config.yaml
# homelabctl configuration — daemon runs on falcon-control

# ─────────────────────────────────────────────
# Global SSH defaults (per-node overrides below)
# ─────────────────────────────────────────────
ssh:
  user: homelabctl
  identity_file: /etc/homelabctl/keys/id_ed25519
  port: 22
  connect_timeout: 10s
  strict_host_key_checking: true
  known_hosts_file: /etc/homelabctl/keys/known_hosts

# ─────────────────────────────────────────────
# Sentinel: mains-power proxy, NOT a managed node
# ─────────────────────────────────────────────
sentinel:
  host: falcon-lite
  address: 192.168.1.10
  check_method: icmp
  check_interval: 30s          # how often we ping falcon-lite
  outage_grace_period: 900s    # 15 min of no response before declaring outage
  restore_grace_period: 900s   # 15 min of falcon-lite being back before WoL'ing nodes

# ─────────────────────────────────────────────
# Managed nodes (all on inverter/battery backup)
# ─────────────────────────────────────────────
nodes:
  falcon-control:
    address: 192.168.1.11
    mac: "b8:27:eb:00:00:01"
    always_on: true             # hosts the daemon itself; never powered off by schedule
    services:
      - pihole
      - upsnap
      - tailscale

  falcon-heavy:
    address: 192.168.1.12
    mac: "b8:27:eb:00:00:02"
    wait_after_boot: 180s        # static delay before considered "ready"
    services:
      - jellyfin
      - immich
      - truenas

  falcon1:
    address: 192.168.1.13
    mac: "b8:27:eb:00:00:03"
    wait_after_boot: 60s
    services:
      - proxmox-backup-server
      - borg-target

  falcon2:
    address: 192.168.1.14
    mac: "b8:27:eb:00:00:04"
    wait_after_boot: 45s
    services:
      - transmission
      - navidrome
      - slskd

# ─────────────────────────────────────────────
# Profiles: named sets of active nodes.
# List order = boot order. Shutdown = reverse order.
# ─────────────────────────────────────────────
profiles:
  backup:
    nodes:
      - falcon1
      - falcon-heavy

  movie:
    nodes:
      - falcon-heavy
      - falcon2

  off:
    nodes: []                   # shuts down all managed nodes (falcon-control excluded, always_on)

  all:
    nodes:
      - falcon1
      - falcon-heavy
      - falcon2

# ─────────────────────────────────────────────
# Default daily schedule (24h local time)
# ─────────────────────────────────────────────
schedule:
  timezone: local
  entries:
    - time: "09:00"
      profile: backup
    - time: "12:30"
      profile: movie
    - time: "23:00"
      profile: off

# ─────────────────────────────────────────────
# Manual override behavior
# ─────────────────────────────────────────────
overrides:
  default_duration: 1h          # used when --for / --indefinite not specified
  # --for <duration> and --indefinite are CLI flags, not config values,
  # but the default above governs unflagged `homelabctl override <profile>` calls
